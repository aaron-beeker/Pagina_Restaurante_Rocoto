<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Rocoto Restaurante Chifa</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-background": "#1c1b1b",
              background: "#fcf9f8",
              surface: "#fcf9f8",
              primary: "#003b1b",
              secondary: "#bc0000",
              "primary-container": "#14532d",
              "surface-container": "#f0eded",
              "surface-container-low": "#f6f3f2",
              "surface-container-lowest": "#ffffff",
              "surface-variant": "#e5e2e1",
              "on-surface-variant": "#404941",
            },
            fontFamily: {
              h1: ["Noto Serif"],
              h3: ["Noto Serif"],
              display: ["Noto Serif"],
              "body-lg": ["Be Vietnam Pro"],
              "body-md": ["Be Vietnam Pro"],
              "body-sm": ["Be Vietnam Pro"],
              button: ["Be Vietnam Pro"],
              "label-caps": ["Be Vietnam Pro"],
            },
            fontSize: {
              h3: ["22px", { lineHeight: "1.4", fontWeight: "600" }],
              display: ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
              "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
              "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
              h1: ["36px", { lineHeight: "1.2", fontWeight: "700" }],
              "label-caps": ["12px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "700" }],
              "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }],
              button: ["14px", { lineHeight: "1", letterSpacing: "0.02em", fontWeight: "600" }],
            },
            spacing: {
              xl: "80px",
            },
            animation: {
              'slow-zoom': 'slow-zoom 20s infinite alternate',
              'bounce-slow': 'bounce-slow 3s infinite',
            },
            keyframes: {
              'slow-zoom': {
                '0%': { transform: 'scale(1)' },
                '100%': { transform: 'scale(1.1)' },
              },
              'bounce-slow': {
                '0%, 100%': { transform: 'translateY(-5%)', animationTimingFunction: 'cubic-bezier(0.8, 0, 1, 1)' },
                '50%': { transform: 'translateY(0)', animationTimingFunction: 'cubic-bezier(0, 0, 0.2, 1)' },
              }
            }
          },
        },
      };
    </script>
  </head>
  <body class="bg-background font-body-md text-stone-900 antialiased">
      
    <div id="app"></div>
    <!-- Añadir antes de app.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="/src/app.js" type="module"></script>
  </body>
</html>
