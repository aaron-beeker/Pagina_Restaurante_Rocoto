<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Rocoto Restaurante Chifa</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-background": "#1c1b1b",
              background: "#fcf9f8",
              surface: "#fcf9f8",
              primary: "#003b1b",
              secondary: "#bc0000",
              "primary-container": "#14532d",
              "surface-container": "#f0eded",
              "surface-container-low": "#f6f3f2",
              "surface-container-lowest": "#ffffff",
              "surface-variant": "#e5e2e1",
              "on-surface-variant": "#404941",
            },
            fontFamily: {
              h1: ["Noto Serif"],
              h3: ["Noto Serif"],
              display: ["Noto Serif"],
              "body-lg": ["Be Vietnam Pro"],
              "body-md": ["Be Vietnam Pro"],
              "body-sm": ["Be Vietnam Pro"],
              button: ["Be Vietnam Pro"],
              "label-caps": ["Be Vietnam Pro"],
            },
            fontSize: {
              h3: ["22px", { lineHeight: "1.4", fontWeight: "600" }],
              display: ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
              "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
              "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
              h1: ["36px", { lineHeight: "1.2", fontWeight: "700" }],
              "label-caps": ["12px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "700" }],
              "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }],
              button: ["14px", { lineHeight: "1", letterSpacing: "0.02em", fontWeight: "600" }],
            },
            spacing: {
              xl: "80px",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-background font-body-md text-stone-900 antialiased">
    <div id="app"></div>
    <script src="/src/app.js" type="module"></script>
  </body>
</html>
