<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Rocoto Restaurante Chifa</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-background": "#18181b",
              background: "#fafafa",
              surface: "#ffffff",
              primary: "#003b1b",
              secondary: "#bc0000",
              "primary-container": "#003b1b",
              "surface-container": "#f4f4f5",
              "surface-container-low": "#fafafa",
              "surface-container-lowest": "#ffffff",
              "surface-variant": "#f1f1f1",
              "on-surface-variant": "#52525b",
            },
            fontFamily: {
              display: ["Nunito", "sans-serif"],
              sans: ["Open Sans", "sans-serif"],
            },
            fontSize: {
              xs: ["12px", { lineHeight: "1.2", letterSpacing: "0.01em" }],
              sm: ["14px", { lineHeight: "1.5" }],
              base: ["16px", { lineHeight: "1.6" }],
              lg: ["18px", { lineHeight: "1.6" }],
              xl: ["20px", { lineHeight: "1.4", fontWeight: "600" }],
              "2xl": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
              "3xl": ["30px", { lineHeight: "1.2", fontWeight: "700" }],
              "4xl": ["36px", { lineHeight: "1.1", fontWeight: "700" }],
              "5xl": ["48px", { lineHeight: "1.1", letterSpacing: "-0.01em", fontWeight: "800" }],
            },
            spacing: {
              xl: "80px",
            },
            animation: {
              'slow-zoom': 'slow-zoom 20s infinite alternate',
              'bounce-slow': 'bounce-slow 3s infinite',
              'slide-in-left': 'slide-in-left 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-in-right': 'slide-in-right 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
            },
            keyframes: {
              'slow-zoom': {
                '0%': { transform: 'scale(1)' },
                '100%': { transform: 'scale(1.1)' },
              },
              'bounce-slow': {
                '0%, 100%': { transform: 'translateY(-5%)', animationTimingFunction: 'cubic-bezier(0.8, 0, 1, 1)' },
                '50%': { transform: 'translateY(0)', animationTimingFunction: 'cubic-bezier(0, 0, 0.2, 1)' },
              },
              'slide-in-left': {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(0)' },
              },
              'slide-in-right': {
                '0%': { transform: 'translateX(100%)' },
                '100%': { transform: 'translateX(0)' },
              }
            }
          },
        },
      };
    </script>
  </head>
  <body class="bg-background font-sans text-on-background antialiased">
      
    <div id="app"></div>
    <!-- Añadir antes de app.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="/src/app.js" type="module"></script>
  </body>
</html>
